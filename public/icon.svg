<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f1f33" />
      <stop offset="50%" stopColor="#081421" />
      <stop offset="100%" stopColor="#040a12" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffe071" />
      <stop offset="50%" stopColor="#fbbc2b" />
      <stop offset="100%" stopColor="#d9970a" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Shield -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#emblemBg)" stroke="#fbbc2b" stroke-width="3" />

  <!-- Highway Line -->
  <path d="M18 88 L102 88" stroke="#fbbc2b" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Forward Movement Chevron -->
  <path d="M98 52 L106 58 L98 64" stroke="#fbbc2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

