  <!-- Heavy-Duty Wheels -->
  <circle cx="80" cy="80" r="11" fill="#081421" stroke="#fbbc2b" stroke-width="2.8" />
  <circle cx="80" cy="80" r="4.5" fill="url(#goldGradient)" />

  <circle cx="38" cy="80" r="11" fill="#081421" stroke="#fbbc2b" stroke-width="2.8" />
  <circle cx="38" cy="80" r="4.5" fill="url(#goldGradient)" />
