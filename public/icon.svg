  <path d="M48 40 L68 40 C73 40, 78 44, 81 49 L89 60 L48 60 Z" fill="url(#goldGradient)" />
  <path d="M54 44 L67 44 C70 44, 73 46, 75 50 L81 57 L54 57 Z" fill="#081421" />

  <path d="M24 58 L46 58 L48 48 L48 60 L92 60 C96 60, 99 63, 98 67 L95 76 C94 78, 92 80, 89 80 L25 80 C23 80, 21 78, 21 75 L22 62 C22 60, 23 58, 24 58 Z" fill="url(#goldGradient)" />

  <!-- Cargo Freight Box -->
